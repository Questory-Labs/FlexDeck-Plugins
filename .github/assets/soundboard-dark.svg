  <text x="40" y="98" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="32" font-weight="600" letter-spacing="-0.5" text-anchor="start" fill="#ecebe6">Soundboard</text>
