<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Spotify: Like it, playlist it, move it to another speaker, with the album art on a key.">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#1111131c"/></pattern>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.12"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="litglow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.24"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a1f"/><stop offset="0.55" stop-color="#7c2d12"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f5f1" stop-opacity="0.9"/><stop offset="0.5" stop-color="#f6f5f1" stop-opacity="0.2"/><stop offset="1" stop-color="#f6f5f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="320" rx="24" fill="#f6f5f1"/>
  <rect width="960" height="320" rx="24" fill="url(#dots)"/>
