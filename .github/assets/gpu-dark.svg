    <text x="765.3333333333333" y="194" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" fill="#8d8c86">POWER</text>
    <text x="765.3333333333333" y="224" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="22" font-weight="700" letter-spacing="-0.3" text-anchor="middle" fill="#ecebe6">312 W</text>
    <text x="765.3333333333333" y="249" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="0.5" text-anchor="middle" fill="#8d8c86">OF 360 W</text>
