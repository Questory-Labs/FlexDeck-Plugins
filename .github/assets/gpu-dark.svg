    <text x="480" y="224" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="22" font-weight="700" letter-spacing="-0.3" text-anchor="middle" fill="#ecebe6">96%</text>
    <text x="480" y="249" font-family="ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="0.5" text-anchor="middle" fill="#8d8c86">LOAD</text>
