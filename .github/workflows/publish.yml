name: Publish all

# Builds and releases EVERY plugin version that has no release yet, in one go,
# then rebuilds the index. Plugins are normally released one at a time with
# *Release plugin* (release.yml); this is for the first publish of the
# repository, and for repair: an index that missed a release is rebuilt here.
#
#   1. Each plugin version that has no release yet is built and packed: node
#      plugins and recipes on Linux, native ones on Windows.
#   2. Each package gets a GitHub release with it attached (see scripts/release.mjs).
#   3. repository.min.json is rebuilt from the releases, listing each plugin's
#      newest one, and committed to main.
#
# A package is built once. A version that already has a release is left alone,
# so a published checksum never changes.
on:
  workflow_dispatch:

permissions:
  contents: read

# Queued, never cancelled: two runs committing at once would race.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  node:
    name: Node plugins and recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tags say which versions are already published.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -r --if-present --filter "!flexdeck-plugins" --filter "!@flexdeck/plugin-soundboard" test

      - name: Pack what is new
        run: node scripts/build.mjs --runtime node,recipe

      - uses: actions/upload-artifact@v4
        with:
          name: packages-node
          path: dist/*.fdpkg
          if-no-files-found: ignore

  native:
    name: Native plugins (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tags say which versions are already published.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: cargo test -p flexdeck-plugin-soundboard

      - name: Build and pack what is new
        run: node scripts/build.mjs --runtime native

      - uses: actions/upload-artifact@v4
        with:
          name: packages-native
          path: dist/*.fdpkg
          if-no-files-found: ignore

  release:
    name: Release and index
    needs: [node, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes read each plugin's history, and the index the release tags.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      # The packages were built from this run's commit, so they are released on it.
      - name: Release what has no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --target "${{ github.sha }}"

      - name: Rebuild the index, commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q --tags origin main
            git checkout -q -B main origin/main
            node scripts/index.mjs
            git add repository.json repository.min.json
            if git diff --cached --quiet; then
              echo "The index is up to date."
              exit 0
            fi
            git commit -qm "chore(repo): rebuild the index [skip ci]"
            if git push -q origin main; then
              exit 0
            fi
            echo "main moved; trying again ($attempt)"
            sleep $((attempt * 5))
          done
          echo "::error::could not push to main"
          exit 1
