name: Release icon packs

# Release the FlexDeck Essentials icon packs: Actions → Release icon packs → Run
# workflow, pick the version. Or push a commit to main with a
# `release(icon-packs): v<version>` line (release-on-push.yml).
#
#   1. Work out the version (patch, minor, major, an exact one, or blank for the
#      one already in icon-packs/), redraw the packs with it, and commit
#      `release(icon-packs): v<version>` to main if anything changed.
#   2. Cut the GitHub release `icon-packs/v<version>` with both zips attached.
#   3. Rebuild repository.min.json so it lists these packs, pointing at those
#      zips, and commit it to main. A pre-release stays out of the index.
#
# Their tags never look like a plugin's.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, an exact version (2.1.0, 2.1.0-rc.1), or blank for the version already in icon-packs/"
        type: string
        default: patch
  workflow_call:
    inputs:
      version:
        type: string
        default: ""

permissions:
  contents: read

run-name: Release icon packs (${{ inputs.version || 'as in the code' }})

jobs:
  release:
    name: Release icon packs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Inputs reach the shell as variables, never pasted into the script.
      - name: Choose the version
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/prepare-icons.mjs "$VERSION"

      - name: Draw the packs
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/icon-pack.mjs "$VERSION"

      - name: Commit the version
        id: commit
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git add icon-packs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "release(icon-packs): v$VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          flags=(--latest=false)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            dist/icon-packs/*.zip \
            --target "$SHA" \
            --title "FlexDeck Essentials icon packs $VERSION" \
            --notes "The FlexDeck Essentials icon packs, outline and filled. Download a zip and add it in FlexDeck's icon picker." \
            "${flags[@]}"

      - name: Rebuild the index, commit
        if: steps.plan.outputs.prerelease != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q --tags origin main
            git reset -q --hard origin/main
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::no tag $TAG: the release was not made"
              exit 1
            fi
            node scripts/index.mjs
            git add repository.json repository.min.json
            if git diff --cached --quiet; then
              echo "the index already lists $TAG"
              exit 0
            fi
            git commit -qm "chore(repo): publish $TAG [skip ci]"
            if git push -q origin HEAD:main; then
              echo "indexed $TAG"
              exit 0
            fi
            echo "main moved; trying again ($attempt)"
            sleep $((attempt * 5))
          done
          echo "::error::could not push to main"
          exit 1

      - name: Summary
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          {
            echo "### $TAG"
            echo
            echo "Attached: $(cd dist/icon-packs && ls *.zip | paste -sd ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
