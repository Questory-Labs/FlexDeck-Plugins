name: Release plugin

# Release one plugin: Actions → Release plugin → Run workflow, pick the plugin
# and the version. Or push a commit to main with a `release(<id>): v<version>`
# line (release-on-push.yml).
#
#   1. prepare   Work out the version (patch, minor, major, an exact one, or
#                blank for the one already in the code), write it into the
#                plugin, test it, and commit `release(<id>): v<version>` to main.
#   2. build     Build and pack that one plugin: on Windows for a native plugin,
#                on Linux otherwise.
#   3. publish   Cut the GitHub release `<id>-v<version>` with the package
#                attached and the notes from the plugin's `feat`/`fix`/`perf`/
#                `sec` lines, then rebuild repository.min.json so it lists this
#                version, pointing at that attachment, and commit it to main.
#
# FlexDeck re-reads the index within six hours and offers the update. A
# pre-release (1.2.0-rc.1) is released on GitHub only and stays out of the
# index, so nobody is updated to it.
#
# If a step fails after `prepare` committed the version, run this again with
# the version left blank: it releases what is in the code. If only the index
# failed, after the release was made, run Publish all: it rebuilds the index.
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        type: choice
        # Every id under plugins/ and recipes/; scripts/check.mjs keeps this list honest.
        options:
          - calendar
          - crypto
          - discord
          - home-assistant
          - obs
          - soundboard
          - spotify
          - streamerbot
          - weather
      version:
        description: "patch, minor, major, an exact version (1.2.0, 1.2.0-rc.1), or blank for the version already in the code"
        type: string
        default: patch
  workflow_call:
    inputs:
      plugin:
        type: string
        required: true
      version:
        type: string
        default: ""

permissions:
  contents: read

run-name: Release ${{ inputs.plugin }} (${{ inputs.version || 'as in the code' }})

jobs:
  prepare:
    name: Prepare ${{ inputs.plugin }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      runtime: ${{ steps.plan.outputs.runtime }}
      package: ${{ steps.plan.outputs.package }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The release tags say which versions are already published.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Inputs reach the shell as variables, never pasted into the script.
      - name: Choose the version
        id: plan
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs "$PLUGIN" "$VERSION"

      - name: Check
        run: pnpm check

      - name: Typecheck and test
        if: steps.plan.outputs.runtime == 'node'
        run: |
          pnpm --filter "${{ steps.plan.outputs.package }}" run --if-present typecheck
          pnpm --filter "${{ steps.plan.outputs.package }}" run test

      - name: Commit the version
        id: commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "release(${{ inputs.plugin }}): v${{ steps.plan.outputs.version }}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ inputs.plugin }} ${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - if: needs.prepare.outputs.runtime == 'native'
        uses: dtolnay/rust-toolchain@stable

      - if: needs.prepare.outputs.runtime == 'native'
        uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Test
        if: needs.prepare.outputs.runtime == 'native'
        run: pnpm --filter "${{ needs.prepare.outputs.package }}" test

      - name: Build and pack
        run: node scripts/build.mjs --only "${{ inputs.plugin }}"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/${{ inputs.plugin }}-${{ needs.prepare.outputs.version }}.fdpkg
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The notes read each plugin's history, and the index the release tags.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --only "${{ inputs.plugin }}" --target "${{ needs.prepare.outputs.sha }}"

      # Other plugins may be released at the same time. On a rejected push, start
      # again from the new main and its tags: rebuild the index, retry.
      - name: Rebuild the index, commit
        if: needs.prepare.outputs.prerelease != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q --tags origin main
            git reset -q --hard origin/main
            node scripts/index.mjs
            git add repository.json repository.min.json
            if git diff --cached --quiet; then
              echo "the index already lists ${{ needs.prepare.outputs.tag }}"
              exit 0
            fi
            git commit -qm "chore(repo): publish ${{ needs.prepare.outputs.tag }} [skip ci]"
            if git push -q origin HEAD:main; then
              echo "indexed ${{ needs.prepare.outputs.tag }}"
              exit 0
            fi
            echo "main moved; trying again ($attempt)"
            sleep $((attempt * 5))
          done
          echo "::error::could not push to main"
          exit 1

      - name: Summary
        run: |
          {
            echo "### ${{ needs.prepare.outputs.tag }}"
            echo
            if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
              echo "Pre-release: on GitHub only, not in the index."
            else
              echo "In \`repository.min.json\` as the newest ${{ inputs.plugin }}; FlexDeck offers it within six hours."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
